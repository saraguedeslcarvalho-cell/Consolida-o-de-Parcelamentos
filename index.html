<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrator de Parcelamentos PDF para Excel</title>
  
  <!-- Bibliotecas externas (PDF.js e SheetJS/XLSX) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; color: #111827; }
    p { color: #4b5563; font-size: 15px; }
    .input-group {
      margin: 24px 0;
      padding: 24px;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      text-align: center;
    }
    input[type="file"] { margin-top: 10px; }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    #status {
      margin-top: 20px;
      font-weight: 600;
      color: #1e293b;
      word-break: break-word;
    }
    .note { font-size: 13px; color: #64748b; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Extrator de Parcelamentos e Tributos</h2>
    <p>Selecione até 50 PDFs de parcelamento para consolidar todas as linhas em uma planilha no formato exato da base do e-CAC.</p>
    
    <div class="input-group">
      <label for="pdfFiles"><strong>Escolha os arquivos PDF:</strong></label><br>
      <input type="file" id="pdfFiles" accept="application/pdf" multiple />
    </div>

    <button id="processBtn" onclick="processPDFs()">Processar e Baixar Planilha</button>

    <div id="status"></div>
    <div class="note">
      🔒 Processamento 100% local no seu navegador. Nenhum dado é enviado para a internet.
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function processPDFs() {
      const input = document.getElementById('pdfFiles');
      const status = document.getElementById('status');
      const btn = document.getElementById('processBtn');

      if (!input.files.length) {
        alert("Por favor, selecione ao menos 1 arquivo PDF.");
        return;
      }

      if (input.files.length > 50) {
        alert("Por favor, selecione no máximo 50 arquivos por vez.");
        return;
      }

      btn.disabled = true;
      const allRows = [];

      for (let i = 0; i < input.files.length; i++) {
        const file = input.files[i];
        status.innerText = `⏳ Processando PDF ${i + 1} de ${input.files.length}: ${file.name}...`;

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          
          let parcelamentoNum = "Não identificado";

          for (let p = 1; p <= pdf.numPages; p++) {
            const page = await pdf.getPage(p);
            const textContent = await page.getTextContent();
            
            // Agrupa textos por posição Y (linhas do documento)
            const linesMap = {};
            textContent.items.forEach(item => {
              const y = Math.round(item.transform[5]);
              if (!linesMap[y]) linesMap[y] = [];
              linesMap[y].push(item);
            });

            // Ordena as linhas de cima para baixo
            const sortedYs = Object.keys(linesMap).sort((a, b) => b - a);
            
            sortedYs.forEach(y => {
              // Ordena os itens da linha da esquerda para a direita
              const lineItems = linesMap[y].sort((a, b) => a.transform[4] - b.transform[4]);
              const tokens = lineItems.map(item => item.str.trim()).filter(Boolean);
              const fullTextLine = tokens.join(" ");

              // Procura o número do parcelamento no cabeçalho ou rodapé
              if (parcelamentoNum === "Não identificado") {
                const matchNumber = fullTextLine.match(/\b\d{10,20}\b/);
                if (matchNumber && !fullTextLine.includes('/')) {
                  parcelamentoNum = matchNumber[0];
                }
              }

              // Identifica linha de débito (geralmente contém um código de receita tipo XXXX-XX e valores)
              const receitaIndex = tokens.findIndex(t => /^\d{4}-\d{2}$/.test(t));
              
              if (receitaIndex !== -1) {
                const receita = tokens[receitaIndex];
                
                // Extrai valores a partir dos tokens da linha
                const cnpj = tokens.find(t => /^\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}$/.test(t)) || "";
                const datas = tokens.filter(t => /^\d{2}\/\d{2}\/\d{4}$/.test(t) || /^[a-zç]+\/\d{4}$/i.test(t));
                const periodoApuracao = datas[0] || "";
                const vencimento = datas[1] || "";

                // Busca valores numéricos/monetários
                const valoresBRL = tokens.filter(t => t.startsWith("BRL") || /^\d{1,3}(\.\d{3})*,\d{2}$/.test(t));
                
                // Identifica referência ou processo se existirem
                const referencia = tokens.find((t, idx) => idx > receitaIndex && /^\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}$/.test(t) && t !== cnpj) || "";
                const procAdmin = tokens.find(t => t.toLowerCase().includes("proc")) || "";

                allRows.push({
                  "Nº Parcelamento": parcelamentoNum,
                  "Código de Receita": receita,
                  "Período de apuração": periodoApuracao,
                  "Vencimento": vencimento,
                  "Saldo originário": valoresBRL[0] || "",
                  "Principal (BRL)": valoresBRL[1] || "",
                  "Multa (BRL)": valoresBRL[2] || "",
                  "Juros (BRL)": valoresBRL[3] || "",
                  "Valor consolidado (BRL)": valoresBRL[4] || "",
                  "Processo administrativo": procAdmin,
                  "CNPJ do débito": cnpj,
                  "Referência": referencia,
                  "Arquivo Origem": file.name
                });
              }
            });
          }

        } catch (err) {
          console.error(`Erro ao processar o arquivo ${file.name}:`, err);
        }
      }

      if (allRows.length === 0) {
        status.innerText = "❌ Nenhuma linha de tributo foi identificada nos arquivos enviados.";
        btn.disabled = false;
        return;
      }

      status.innerText = "📊 Gerando planilha Excel...";
      const worksheet = XLSX.utils.json_to_sheet(allRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Tributos Consolidados");

      XLSX.writeFile(workbook, `Consolidado_Parcelamentos_${new Date().toISOString().slice(0,10)}.xlsx`);
      
      status.innerText = `✅ Sucesso! Total de ${allRows.length} linhas de tributos extraídas para o Excel.`;
      btn.disabled = false;
    }
  </script>

</body>
</html>
