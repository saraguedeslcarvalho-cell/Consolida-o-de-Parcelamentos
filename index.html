<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrator de Parcelamentos PDF para Excel</title>
  
  <!-- Bibliotecas externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; color: #111827; }
    p { color: #4b5563; font-size: 15px; }
    .input-group {
      margin: 24px 0;
      padding: 24px;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      text-align: center;
    }
    input[type="file"] { margin-top: 10px; }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    #status {
      margin-top: 20px;
      font-weight: 600;
      color: #1e293b;
      word-break: break-word;
    }
    .note { font-size: 13px; color: #64748b; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Extrator de Parcelamentos RFB (e-CAC)</h2>
    <p>Selecione até 50 PDFs de parcelamento para converter em planilha Excel única e organizada.</p>
    
    <div class="input-group">
      <label for="pdfFiles"><strong>Escolha os arquivos PDF:</strong></label><br>
      <input type="file" id="pdfFiles" accept="application/pdf" multiple />
    </div>

    <button id="processBtn" onclick="processPDFs()">Processar e Baixar Planilha</button>

    <div id="status"></div>
    <div class="note">
      🔒 Processamento 100% local no seu navegador. Nenhum arquivo é enviado para servidores externos.
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function processPDFs() {
      const input = document.getElementById('pdfFiles');
      const status = document.getElementById('status');
      const btn = document.getElementById('processBtn');

      if (!input.files.length) {
        alert("Por favor, selecione ao menos 1 arquivo PDF.");
        return;
      }

      if (input.files.length > 50) {
        alert("Por favor, selecione no máximo 50 arquivos por vez.");
        return;
      }

      btn.disabled = true;
      const allRows = [];

      for (let i = 0; i < input.files.length; i++) {
        const file = input.files[i];
        status.innerText = `⏳ Lendo PDF ${i + 1} de ${input.files.length}: ${file.name}...`;

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          
          let rawText = "";

          // Extrai todo o texto contínuo do PDF
          for (let p = 1; p <= pdf.numPages; p++) {
            const page = await pdf.getPage(p);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join("\n");
            rawText += pageText + "\n";
          }

          // 1. Identifica o Código do Recibo/Parcelamento (Ex: 739452353402259)
          let numParcelamento = "Não identificado";
          const matchRecibo = rawText.match(/Código de controle do recibo:\s*(\d+)/i) || 
                              rawText.match(/(\d{15})/);
          if (matchRecibo) {
            numParcelamento = matchRecibo[1];
          }

          // 2. Trata quebras de linha indesejadas no CNPJ (ex: 03.518.763\n/0001-17)
          const cleanText = rawText.replace(/(\d{2}\.\d{3}\.\d{3})\s*\n\s*(\/\d{4}-\d{2})/g, "$1$2");

          // 3. Divide o texto em blocos/linhas limpas
          const lines = cleanText.split("\n").map(l => l.trim()).filter(Boolean);

          // Regex para identificar código de receita (Ex: 0422-01, 5434-01, 8109-02)
          const receitaRegex = /^\d{4}-\d{2}$/;

          for (let idx = 0; idx < lines.length; idx++) {
            if (receitaRegex.test(lines[idx])) {
              const codigoReceita = lines[idx];

              // Busca retroativa para encontrar o CNPJ do débito mais próximo antes da receita
              let cnpjDebito = "";
              for (let k = idx - 1; k >= Math.max(0, idx - 5); k--) {
                const matchCNPJ = lines[k].match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/);
                if (matchCNPJ) {
                  cnpjDebito = matchCNPJ[0];
                  break;
                }
              }

              // Pega os próximos elementos que compõem as colunas do débito
              const periodoApuracao = lines[idx + 1] || "";
              const vencimento = lines[idx + 2] || "";
              const saldoOriginario = lines[idx + 3] || "";
              const principal = lines[idx + 4] || "";
              const multa = lines[idx + 5] || "";
              const juros = lines[idx + 6] || "";
              const valorConsolidado = lines[idx + 7] || "";

              allRows.push({
                "Código de Receita": codigoReceita,
                "Período de apuração": periodoApuracao,
                "Vencimento": vencimento,
                "Saldo originário": saldoOriginario,
                "Principal (BRL)": principal,
                "Multa (BRL)": multa,
                "Juros (BRL)": juros,
                "Valor consolidado (BRL)": valorConsolidado,
                "Processo administrativo": "",
                "CNPJ do débito": cnpjDebito,
                "Referência": "",
                "Nº Parcelamento": numParcelamento,
                "Arquivo Origem": file.name
              });
            }
          }

        } catch (err) {
          console.error(`Erro ao processar ${file.name}:`, err);
        }
      }

      if (allRows.length === 0) {
        status.innerText = "❌ Nenhuma linha de débito/tributo foi encontrada nos PDFs.";
        btn.disabled = false;
        return;
      }

      status.innerText = "📊 Gerando planilha Excel...";
      const worksheet = XLSX.utils.json_to_sheet(allRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Tributos Parcelados");

      XLSX.writeFile(workbook, `Tributos_Consolidados_${new Date().toISOString().slice(0,10)}.xlsx`);
      
      status.innerText = `✅ Sucesso! Total de ${allRows.length} linhas de débitos extraídas para o Excel.`;
      btn.disabled = false;
    }
  </script>

</body>
</html>
