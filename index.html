<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrator de Parcelamentos PDF para Excel</title>
  
  <!-- Bibliotecas externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; color: #111827; }
    p { color: #4b5563; font-size: 15px; }
    .input-group {
      margin: 24px 0;
      padding: 24px;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      text-align: center;
    }
    input[type="file"] { margin-top: 10px; }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    #status {
      margin-top: 20px;
      font-weight: 600;
      color: #1e293b;
      word-break: break-word;
    }
    .note { font-size: 13px; color: #64748b; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Extrator de Parcelamentos RFB (e-CAC)</h2>
    <p>Selecione os PDFs de parcelamento da Receita Federal para converter em uma planilha Excel limpa e organizada.</p>
    
    <div class="input-group">
      <label for="pdfFiles"><strong>Escolha os arquivos PDF:</strong></label><br>
      <input type="file" id="pdfFiles" accept="application/pdf" multiple />
    </div>

    <button id="processBtn" onclick="processPDFs()">Processar e Baixar Planilha</button>

    <div id="status"></div>
    <div class="note">
      🔒 Processamento 100% local no seu navegador. Nenhum arquivo é enviado para servidores externos.
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function processPDFs() {
      const input = document.getElementById('pdfFiles');
      const status = document.getElementById('status');
      const btn = document.getElementById('processBtn');

      if (!input.files.length) {
        alert("Por favor, selecione ao menos 1 arquivo PDF.");
        return;
      }

      btn.disabled = true;
      const allRows = [];

      for (let i = 0; i < input.files.length; i++) {
        const file = input.files[i];
        status.innerText = `⏳ Lendo PDF ${i + 1} de ${input.files.length}: ${file.name}...`;

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          
          let rawText = "";

          // Junta o texto de todas as páginas
          for (let p = 1; p <= pdf.numPages; p++) {
            const page = await pdf.getPage(p);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join("\n");
            rawText += pageText + "\n";
          }

          // 1. Extrai o Número do Parcelamento
          let numParcelamento = "";
          const matchParc = rawText.match(/Parcelamento:\s*\|\s*(\d+)/i) || 
                            rawText.match(/Código de controle do recibo:\s*(\d+)/i) ||
                            rawText.match(/(\d{15,25})/);
          if (matchParc) {
            numParcelamento = matchParc[1];
          }

          // 2. Trata CNPJs divididos por quebras de linha
          const cleanText = rawText.replace(/(\d{2}\.\d{3}\.\d{3})\s*\n\s*(\/\d{4}-\d{2})/g, "$1$2");
          const lines = cleanText.split("\n").map(l => l.trim()).filter(Boolean);

          // Padrão do código de receita (ex: 0422-01, 0561-07, 1082-01, 5434-01)
          const receitaRegex = /^\d{4}-\d{2}$/;

          for (let idx = 0; idx < lines.length; idx++) {
            if (receitaRegex.test(lines[idx])) {
              const codigoReceita = lines[idx];

              // Busca CNPJ do débito (para trás)
              let cnpjDebito = "";
              for (let k = idx - 1; k >= Math.max(0, idx - 6); k--) {
                const matchCNPJ = lines[k].match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/);
                if (matchCNPJ) {
                  cnpjDebito = matchCNPJ[0];
                  break;
                }
              }

              // Coleta os próximos 12 itens à frente para analisar os padrões dos campos
              const chunk = lines.slice(idx + 1, idx + 13);

              let periodoApuracao = "";
              let vencimento = "";
              let valores = [];

              for (let item of chunk) {
                // Captura data de vencimento (Formato DD/MM/AAAA)
                if (/^\d{2}\/\d{2}\/\d{4}$/.test(item)) {
                  if (!vencimento) vencimento = item;
                } 
                // Captura período de apuração (Ex: janeiro/2025, 05/janeiro/2025, dezembro/2024)
                else if (/[a-z]+\/\d{4}/i.test(item)) {
                  if (!periodoApuracao) periodoApuracao = item;
                } 
                // Captura valores numéricos/monetários
                else if (/^BRL\s*/i.test(item) || /^\d{1,3}(\.\d{3})*,\d{2}$/.test(item)) {
                  valores.push(item.replace(/^BRL\s*/i, ""));
                }
              }

              // Organiza os 5 valores monetários da tabela e-CAC
              const saldoOriginario = valores[0] || "";
              const principal       = valores[1] || "";
              const multa           = valores[2] || "";
              const juros           = valores[3] || "";
              const valorConsolidado= valores[4] || "";

              allRows.push({
                "Nº Parcelamento": numParcelamento,
                "CNPJ do débito": cnpjDebito,
                "Código de Receita": codigoReceita,
                "Período de apuração": periodoApuracao,
                "Vencimento": vencimento,
                "Saldo originário": saldoOriginario,
                "Principal (BRL)": principal,
                "Multa (BRL)": multa,
                "Juros (BRL)": juros,
                "Valor consolidado (BRL)": valorConsolidado,
                "Arquivo Origem": file.name
              });
            }
          }

        } catch (err) {
          console.error(`Erro ao processar ${file.name}:`, err);
        }
      }

      if (allRows.length === 0) {
        status.innerText = "❌ Nenhuma linha de débito encontrada. Verifique se o PDF é um Requerimento de Parcelamento e-CAC.";
        btn.disabled = false;
        return;
      }

      status.innerText = "📊 Gerando planilha Excel...";
      const worksheet = XLSX.utils.json_to_sheet(allRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Parcelamentos");

      XLSX.writeFile(workbook, `Parcelamentos_RFB_${new Date().toISOString().slice(0,10)}.xlsx`);
      
      status.innerText = `✅ Sucesso! Extraídas ${allRows.length} linhas de débitos para a planilha.`;
      btn.disabled = false;
    }
  </script>

</body>
</html>
